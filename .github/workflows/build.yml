# This workflow will build a Java project with Maven

name: Java CI with Maven in Linux

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      workdir: ./com.prova.app
      COVERALLS_REPO_TOKEN: ${{ secrets.COVERALLS_TOKEN }}
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    strategy:
      matrix:
        java: [17, 21]

    name: Build with Java ${{ matrix.java }} on Linux
    steps:
    - uses: actions/checkout@v6
    
    - name: Set up JDK ${{ matrix.java }}
      uses: actions/setup-java@v5
      with:
        java-version: ${{ matrix.java }}
        distribution: 'temurin'
        
    - name: Cache Maven packages
      uses: actions/cache@v5
      with:
        path: ~/.m2
        key: ${{ runner.os }}-m2-jdk${{ matrix.java }}-${{ hashFiles('**/pom.xml', '**/*.yml') }}
        restore-keys: ${{ runner.os }}-m2-
        
    - name: Set Maven Additional Options
      run: |
        echo "ADDITIONAL_MAVEN_OPTIONS=-Pcoveralls" >> $GITHUB_ENV
      # if: ${{ env.COVERALLS_REPO_TOKEN && matrix.java == 17 }}
      
    - name: Build with Maven
      run: >
        mvn verify $ADDITIONAL_MAVEN_OPTIONS
      working-directory: ${{ env.workdir }}
      
    - name: Generate JUnit Report
      run: >
        mvn surefire-report:report-only
      working-directory: ${{ env.workdir }}
      if: ${{ always() }}
      
    - name: Archive JUnit Report
      uses: actions/upload-artifact@v6
      if: ${{ always() }}
      with:
        name: surefire-report-jdk-${{ matrix.java }}
        path: '**/target/reports'
        
    - name: Build and analyze
      run: mvn -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar -Dsonar.projectKey=MatteoBollecchino_git-prova
      working-directory: ${{ env.workdir }}
      if: ${{ env.SONAR_TOKEN && matrix.java == 17 }}
